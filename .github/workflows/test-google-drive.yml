
name: Test Google Drive Connection

on:
  workflow_dispatch:

jobs:
  test-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google libraries
        run: |
          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Restore Google token
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          python -c "import os; from pathlib import Path; Path('token.json').write_text(os.environ['GOOGLE_OAUTH_TOKEN'], encoding='utf-8')"

      - name: Test Google Drive access
        run: python test_google_drive.py

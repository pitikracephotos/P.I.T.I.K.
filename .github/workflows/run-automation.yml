name: P.I.T.I.K. FindMyShots Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore Google OAuth token
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("GOOGLE_OAUTH_TOKEN")
          if not token:
              raise SystemExit(
                  "Missing GOOGLE_OAUTH_TOKEN repository secret."
              )

          Path("token.json").write_text(token, encoding="utf-8")
          PY

      - name: Run automation
        run: python main.py

      - name: Upload local logs and downloaded files if run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pitik-debug-output
          path: |
            downloads/
          if-no-files-found: ignore
          retention-days: 7
